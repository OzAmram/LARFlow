[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lardiff"
version = "0.1.0"
description = "Flow-matching point-cloud generative model for liquid-argon energy deposits, adapted from AllShowers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy",
    "h5py",
    "pyyaml",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["lardiff"]
