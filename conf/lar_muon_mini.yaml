# small config for smoke tests on the mini cache (CPU-friendly)
run_name: LAr-muon-CNF-mini

data:
  path: /global/cfs/cdirs/m2612/ozamram/LAR_Diffu/cache/lar_pdg13_mini.h5
  max_num_points: 512
  val_len: 64
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 3]}]
  samples_energy_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  cond_trafo:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 2]}]

model:
  dim_inputs: [4, 6, 2]
  dim_embedding: 32
  num_head: 2  # head_dim must be >= 16 for the compiled flex-attention kernel
  num_blocks: 2
  dim_feedforward: 64
  num_particles: 1
  activation: GELU
  flow_config:
    frequencies: 3

train:
  num_epochs: 4
  batch_size: 32
  learning_rate: 1.e-3
  optimizer: AdamW
  scheduler: Cosine
  weight_decay: 1.e-2
  grad_clip: 0.2
