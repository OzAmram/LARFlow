run_name: LAr-muon-CNF

data:
  path: /global/cfs/cdirs/m2612/ozamram/LAR_Diffu/cache/lar_pdg13_maxp4096.h5
  max_num_points: 4096
  val_len: 10240  # multiple of batch size, avoids BlockMask recompile on a ragged last batch
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 3]}]
  samples_energy_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  cond_trafo:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 2]}]

model:
  dim_inputs: [4, 6, 2]
  dim_embedding: 128
  num_head: 8
  num_blocks: 6
  dim_feedforward: 512
  num_particles: 1
  activation: GELU
  flow_config:
    frequencies: 3

train:
  num_epochs: 100
  batch_size: 128
  learning_rate: 1.e-3
  optimizer: AdamW
  scheduler: CosineWarmup
  weight_decay: 1.e-2
  grad_clip: 0.2
