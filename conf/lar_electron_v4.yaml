# v4 = v3 architecture, with the two conditioning/selection fixes:
#   - the third cond channel is now E_dep, not R (see lar_data.load_and_prepare)
#   - the validation loss is evaluated at fixed stratified times on fixed noise,
#     so best.pt tracks the model rather than the draw (train.val_seed)
# Everything else is byte-identical to lar_electron_v3.yaml, so this run is
# comparable to v2/v3 on architecture and schedule.
run_name: LAr-electron-CNF-v4

data:
  path: /global/cfs/cdirs/m2612/ozamram/LAR_Diffu/cache/lar_pdg11_maxp8192.h5
  max_num_points: 8192
  val_len: 10240  # multiple of batch size, avoids BlockMask recompile on a ragged last batch
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 3]}]
  samples_energy_trafo:
    - [Log, {alpha: 1.0e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  cond_trafo:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 3]}]

model:
  dim_inputs: [4, 6, 3]
  dim_embedding: 128
  num_head: 8
  num_blocks: 6
  dim_feedforward: 512
  num_particles: 1
  activation: GELU
  flow_config:
    frequencies: 3

train:
  num_epochs: 40
  batch_size: 64
  learning_rate: 1.e-3
  optimizer: AdamW
  scheduler: CosineWarmup
  weight_decay: 1.e-2
  grad_clip: 0.2
  val_seed: 0
